name: gorush
summary: |-
  Push notification gateway server — Trust Wallet's internal service that delivers mobile push notifications to iOS (APNs), Android (FCM), and Huawei (HMS) devices.

  Route here for: Tasks involving push notification delivery logic, APNs/FCM/HMS client configuration, notification payload schemas, queue-based async dispatch, or the /api/push HTTP endpoint.

  Do NOT route here for: Notification *routing decisions* (which users get which push) — that lives in notification-manager-service; mobile app push subscription management — that's in the mobile monorepo.

  Consumers: notification-manager-service (primary caller via HTTP POST /api/push and gRPC Send); any Trust Wallet backend service that needs direct push delivery.

  Ships: A Go binary (gorush) deployable as a Heroku app or Docker container; exposes POST /api/push (HTTP) and a gRPC Send endpoint; emits Prometheus metrics at /metrics.

  Agent routing: main.go = entry point; router/ = HTTP routing; notify/ = platform dispatch; config/ = all credentials/config; storage/ = delivery counter backends; rpc/ = gRPC server; knowledge/architecture/overview.md = system overview.
